<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b21b6">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>एक संघ तरुण मंडळ | गणेशोत्सव २०२६</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#17171a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Devanagari","Segoe UI",sans-serif}
.header{background:linear-gradient(135deg,#4c1d95,#7c3aed);color:#fff;padding:34px 18px;border-radius:0 0 30px 30px}.header h1{margin:0;font-size:28px}.header p{margin:8px 0 0;font-size:15px}
.wrap{max-width:900px;margin:auto;padding:15px}.card{background:#fff;border:1px solid #e5e5ea;border-radius:20px;padding:17px;margin-bottom:14px;box-shadow:0 4px 16px #0000000a}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#777}.hidden{display:none!important}
button{border:0;border-radius:13px;padding:12px 15px;font-size:16px;font-weight:700;background:#eeeef3}.primary{background:#6d28d9;color:#fff}.danger{background:#fee2e2;color:#b91c1c}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{min-height:110px}.label{color:#73737b;font-size:17px}.value{font-size:30px;font-weight:800;margin-top:9px}.green{color:#16835b}.red{color:#c83242}.purple{color:#5b21b6}
.tabs{display:flex;gap:8px;overflow:auto;margin:2px 0 15px}.tab{white-space:nowrap}.tab.active{background:#6d28d9;color:#fff}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;font-size:14px;font-weight:700;margin-bottom:5px;color:#555}
input,select,textarea{width:100%;padding:12px;border:1px solid #d8d8df;border-radius:12px;font-size:16px;background:#fff}textarea{min-height:75px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.tx{border-top:1px solid #eee;padding:13px 0}.tx:first-child{border-top:0}.txrow{display:flex;justify-content:space-between;gap:10px}.txname{font-weight:800}.amount{font-weight:800;font-size:18px}.small{font-size:13px;color:#777;margin-top:4px}
.notice{padding:12px;border-radius:12px;background:#f3e8ff;color:#5b21b6;font-size:14px;margin-top:10px}.error{background:#fff1f2;color:#be123c}
.ok{background:#ecfdf5;color:#047857}.loading{text-align:center;padding:25px}
@media(max-width:620px){.grid,.formgrid{grid-template-columns:1fr}.bar{align-items:flex-start;flex-direction:column}.header h1{font-size:25px}}
</style>
</head>
<body>
<header class="header">
<h1>🪔 एक संघ तरुण मंडळ</h1>
<p>टोप (सोनारगल्ली) • गणेशोत्सव २०२६ • Treasurer Management</p><div style="margin-top:12px;font-weight:800;font-size:16px">🔐 Treasurer: Karan Mulik</div>
</header>

<main class="wrap">
<section class="card">
 <div class="bar">
  <div><b id="mode">👀 View Mode</b><div class="muted" id="sub">Cloud मधील live data</div></div>
  <button class="primary" id="loginBtn" type="button">🔐 Treasurer Login</button>
 </div>
 <div id="loginBox" class="hidden" style="margin-top:15px">
  <div class="formgrid">
   <div><label>Username</label><input id="username" value="karan" autocomplete="username"></div>
   <div><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
  </div>
  <div class="actions"><button class="primary" id="login" type="button">🔓 Login</button><button id="cancel" type="button">Cancel</button></div>
  <div id="msg" class="notice hidden"></div>
 </div>
</section>

<section class="grid">
 <div class="card stat"><div class="label">एकूण देणगी</div><div class="value green" id="tin">₹0</div></div>
 <div class="card stat"><div class="label">एकूण खर्च</div><div class="value red" id="tout">₹0</div></div>
 <div class="card stat"><div class="label">शिल्लक</div><div class="value purple" id="bal">₹0</div></div>
 <div class="card stat"><div class="label">व्यवहार</div><div class="value" id="cnt">0</div></div>
</section>

<div id="status" class="notice loading">☁️ Cloud data load होत आहे...</div>

<div class="tabs">
 <button class="tab active" data-tab="home" type="button">🏠 Home</button>
 <button class="tab" data-tab="ledger" type="button">📒 Ledger</button>
 <button class="tab editor hidden" data-tab="donation" type="button">💰 देणगी</button>
 <button class="tab editor hidden" data-tab="expense" type="button">💸 खर्च</button>
</div>

<section id="home" class="page"><div class="card"><h2>अलीकडील व्यवहार</h2><div id="recent" class="muted loading">Loading...</div></div></section>

<section id="ledger" class="page hidden"><div class="card"><h2>📒 Ledger</h2><input id="search" placeholder="देणगीदार / खर्च / category शोधा"><div id="list"></div></div></section>

<section id="donation" class="page hidden editor"><div class="card">
<h2>💰 देणगी नोंदवा</h2><div class="formgrid">
<div><label>देणगीदाराचे नाव *</label><input id="dname"></div><div><label>रक्कम *</label><input id="damount" type="number" min="1"></div>
<div><label>तारीख</label><input id="ddate" type="date"></div><div><label>Payment Mode</label><select id="dmode"><option>Cash</option><option>UPI</option><option>Bank</option><option>Cheque</option></select></div>
<div><label>Receipt No.</label><input id="receipt"></div><div><label>Mobile / Note</label><input id="dnote"></div>
</div><div class="actions"><button class="primary" id="saveDonation" type="button">➕ Save Donation</button></div></div></section>

<section id="expense" class="page hidden editor"><div class="card">
<h2>💸 खर्च नोंदवा</h2><div class="formgrid">
<div><label>खर्चाचे वर्णन *</label><input id="edesc"></div><div><label>रक्कम *</label><input id="eamount" type="number" min="1"></div>
<div><label>तारीख</label><input id="edate" type="date"></div><div><label>Category</label><select id="ecat"><option>मंडप व सजावट</option><option>गणेश मूर्ती</option><option>रोषणाई व विद्युत</option><option>ध्वनी व्यवस्था</option><option>पूजा साहित्य</option><option>फुले व हार</option><option>अन्न व प्रसाद</option><option>सांस्कृतिक कार्यक्रम</option><option>वाहतूक</option><option>स्वच्छता</option><option>सुरक्षा व्यवस्था</option><option>जाहिरात व प्रसिद्धी</option><option>परवानगी व शासकीय शुल्क</option><option>बँक / UPI शुल्क</option><option>इतर</option></select></div>
<div><label>Payment Mode</label><select id="emode"><option>Cash</option><option>UPI</option><option>Bank</option><option>Cheque</option></select></div><div><label>Vendor</label><input id="vendor"></div>
<div style="grid-column:1/-1"><label>Bill / Note</label><textarea id="enote"></textarea></div>
</div><div class="actions"><button class="primary" id="saveExpense" type="button">➕ Save Expense</button></div></div></section>
</main>

<script>
const SUPABASE_URL="https://ddreocceewjmfdaltlun.supabase.co";
const SUPABASE_KEY="sb_publishable_RJLtktd30k1cJyhHnEH3oQ_jZLMZkX-";
const EDITOR_EMAIL="karanmulik6300@gmail.com";
const MANDAL_ID="ek-sangh-2026";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let rows=[], editor=false;
const $=id=>document.getElementById(id);
const today=new Date().toLocaleDateString("en-CA");
$("ddate").value=today;$("edate").value=today;

function money(n){return "₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function render(){
 const inc=rows.filter(x=>x.type==="in").reduce((a,x)=>a+Number(x.amount||0),0);
 const out=rows.filter(x=>x.type==="out").reduce((a,x)=>a+Number(x.amount||0),0);
 $("tin").textContent=money(inc); $("tout").textContent=money(out); $("bal").textContent=money(inc-out); $("cnt").textContent=rows.length;
 const sorted=[...rows].sort((a,b)=>String(b.transaction_date).localeCompare(String(a.transaction_date)));
 const q=($("search").value||"").toLowerCase();
 const filtered=sorted.filter(x=>JSON.stringify(x).toLowerCase().includes(q));
 $("recent").innerHTML=sorted.slice(0,8).map(item).join("")||'<div class="muted" style="padding:25px">अजून नोंदी नाहीत.</div>';
 $("list").innerHTML=filtered.map(item).join("")||'<div class="muted" style="padding:25px">नोंद सापडली नाही.</div>';
}

function item(x){
 const inc=x.type==="in";
 const title=inc?(x.donor_name||"देणगी"):(x.description||"खर्च");
 const meta=[x.transaction_date,x.payment_mode,x.category,x.receipt_no,x.vendor,x.mobile_note,x.bill_no_note].filter(Boolean).join(" • ");
 return '<div class="tx"><div class="txrow"><div><div class="txname">'+esc(title)+'</div><div class="small">'+esc(meta)+'</div></div><div class="amount '+(inc?"green":"red")+'">'+(inc?"+":"-")+money(x.amount)+'</div></div>'+(editor?'<div class="actions"><button class="danger" onclick="delRow(\''+x.id+'\')">Delete</button></div>':"")+'</div>';
}

async function load(){
 $("status").className="notice loading"; $("status").textContent="☁️ Cloud data load होत आहे...";
 const {data,error}=await db.from("transactions").select("*").eq("mandal_id",MANDAL_ID).order("transaction_date",{ascending:false});
 if(error){
   console.error(error);
   $("status").className="notice error";
   $("status").textContent="❌ Cloud data load झाला नाही. Internet/refresh तपासा.";
   $("recent").innerHTML='<div class="notice error">Database connection error: '+esc(error.message)+'</div>';
   return;
 }
 rows=data||[]; render();
 $("status").className="notice ok";
 $("status").textContent="☁️ Live Cloud Connected • "+rows.length+" व्यवहार";
}

function setEditor(v){
 editor=v;
 $("mode").textContent=v?"🔐 Treasurer Mode":"👀 View Mode";
 $("sub").textContent=v?"Cloud मध्ये Add / Delete access":"सर्वांना cloud data दिसेल";
 $("loginBtn").textContent=v?"🔓 Treasurer Logout":"🔐 Treasurer Login";
 document.querySelectorAll(".editor").forEach(x=>x.classList.toggle("hidden",!v));
 if(!v) showTab("home");
 render();
}

function show(t,ok=false){$("msg").textContent=t;$("msg").className="notice "+(ok?"ok":"error");}

async function doLogin(){
 $("msg").classList.add("hidden");
 const u=$("username").value.trim().toLowerCase();
 if(u!=="karan"){show("Username चुकीचा आहे.");return}
 const p=$("password").value;
 if(!p){show("Password टाका.");return}
 const {data,error}=await db.auth.signInWithPassword({email:EDITOR_EMAIL,password:p});
 if(error){show("Login failed. Supabase Authentication मध्ये Treasurer user तयार आहे का तपासा.");return}
 if(data.user?.email?.toLowerCase()!==EDITOR_EMAIL.toLowerCase()){
   await db.auth.signOut(); show("हा account Treasurer नाही."); return;
 }
 $("password").value=""; $("loginBox").classList.add("hidden"); setEditor(true); showTab("home");
}

async function logout(){await db.auth.signOut();setEditor(false)}

function showTab(id){
 document.querySelectorAll(".page").forEach(x=>x.classList.toggle("hidden",x.id!==id));
 document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===id));
}

async function add(obj){
 if(!editor){alert("Treasurer login आवश्यक आहे.");return}
 const {data:{session}}=await db.auth.getSession();
 if(!session){setEditor(false);alert("Session expired. पुन्हा login करा.");return}
 const {error}=await db.from("transactions").insert([{...obj,mandal_id:MANDAL_ID}]);
 if(error){alert("Save failed: "+error.message);return}
 await load(); alert("Save झाले.");
}

async function delRow(id){
 if(!editor||!confirm("हा व्यवहार delete करायचा आहे का?"))return;
 const {error}=await db.from("transactions").delete().eq("id",id).eq("mandal_id",MANDAL_ID);
 if(error){alert("Delete failed: "+error.message);return}
 await load();
}
window.delRow=delRow;

$("loginBtn").onclick=()=>editor?logout():$("loginBox").classList.toggle("hidden");
$("cancel").onclick=()=>{$("loginBox").classList.add("hidden");$("msg").classList.add("hidden")};
$("login").onclick=doLogin;
$("password").onkeydown=e=>{if(e.key==="Enter")doLogin()};
document.querySelectorAll(".tab").forEach(x=>x.onclick=()=>showTab(x.dataset.tab));
$("search").oninput=render;

$("saveDonation").onclick=()=>{
 const n=$("dname").value.trim(), a=Number($("damount").value);
 if(!n||a<=0)return alert("नाव आणि रक्कम भरा.");
 add({type:"in",donor_name:n,amount:a,transaction_date:$("ddate").value||today,payment_mode:$("dmode").value,receipt_no:$("receipt").value.trim(),mobile_note:$("dnote").value.trim()});
};

$("saveExpense").onclick=()=>{
 const d=$("edesc").value.trim(), a=Number($("eamount").value);
 if(!d||a<=0)return alert("वर्णन आणि रक्कम भरा.");
 add({type:"out",description:d,amount:a,transaction_date:$("edate").value||today,payment_mode:$("emode").value,category:$("ecat").value,vendor:$("vendor").value.trim(),bill_no_note:$("enote").value.trim()});
};

db.auth.getSession().then(({data})=>{
 if(data.session?.user?.email?.toLowerCase()===EDITOR_EMAIL.toLowerCase()) setEditor(true);
});

db.auth.onAuthStateChange((_event,session)=>{
 if(session?.user?.email?.toLowerCase()===EDITOR_EMAIL.toLowerCase()) setEditor(true);
 else if(!session) setEditor(false);
});

db.channel("transactions-live")
 .on("postgres_changes",{event:"*",schema:"public",table:"transactions",filter:"mandal_id=eq.ek-sangh-2026"},()=>load())
 .subscribe();

load();
</script>
</body>
</html>
